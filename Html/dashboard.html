<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="/Css/Dashboard.css" />
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar admin-navbar">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Admin</span>

      <div class="d-flex gap-2">
        <button class="btn btn-light d-md-none" id="toggleSidebar">
          <i class="bi bi-list"></i>
        </button>
        <button class="btn btn-outline-dark btn-sm logout-btn">
          Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid">
    <div class="row">
      
      <!-- SIDEBAR -->
      <aside class="col-md-3 col-lg-2 admin-sidebar p-3">
        <ul class="nav flex-column gap-2">
          <li>
            <a href="#" class="nav-link active">
              <i class="bi bi-house me-2"></i> Dashboard
            </a>
          </li>
          <li>
            <a href="#" class="nav-link">
              <i class="bi bi-box me-2"></i> Products
            </a>
          </li>
          <li>
            <a href="#" class="nav-link">
              <i class="bi bi-people me-2"></i> Users
            </a>
          </li>
          <li>
            <a href="#" class="nav-link">
              <i class="bi bi-bag-check me-2"></i> Orders
            </a>
          </li>
        </ul>
      </aside>

      <!-- CONTENT -->
      <main class="col-md-9 col-lg-10 admin-content">
        <h3 class="mb-4">Dashboard</h3>

        <!-- STATS -->
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Total Products</h6>
                <h3>120</h3>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Total Users</h6>
                <h3>340</h3>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card shadow-sm">
              <div class="card-body">
                <h6 class="text-muted">Orders</h6>
                <h3>89</h3>
              </div>
            </div>
          </div>
        </div>

        <!-- TABLE -->
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="mb-3">Recent Orders</h5>

            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Customer</th>
                    <th>Product</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td>1</td>
                    <td>Ayesha</td>
                    <td>Silk Hijab</td>
                    <td><span class="badge bg-success">Completed</span></td>
                  </tr>
                  <tr>
                    <td>2</td>
                    <td>Sara</td>
                    <td>Chiffon Hijab</td>
                    <td><span class="badge bg-warning">Pending</span></td>
                  </tr>
                  <tr>
                    <td>3</td>
                    <td>Hina</td>
                    <td>Cotton Hijab</td>
                    <td><span class="badge bg-danger">Cancelled</span></td>
                  </tr>
                </tbody>
              </table>
            </div>

          </div>
        </div>
      </main>

    </div>
  </div>

  <!-- JS -->
  <script>
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.querySelector(".admin-sidebar");

    toggleBtn?.addEventListener("click", () => {
      sidebar.classList.toggle("show");
    });
  </script>

</body>
</html>

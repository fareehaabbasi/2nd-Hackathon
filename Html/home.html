<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Dark Theme -->
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/Css/Dashboard.css" />
</head>

<body>
  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg admin-navbar">
    <div class="container-fluid">
      <span class="navbar-brand fw-bold">Hijab Admin</span>

      <div class="d-flex gap-2">
        <button class="btn btn-light d-md-none" id="toggleSidebar">
          <i class="bi bi-list"></i>
        </button>
        <button class="btn btn-outline-dark btn-sm logout-btn">Logout</button>
      </div>
    </div>
  </nav>

  <!-- CONTENT -->
  <main class="col-md-9 col-lg-10 admin-content">
    <h3 class="mb-3">Home</h3>
    <p>Welcome to Admin Panel</p>
  </main>
  </div>
  </div>

  <div class="home-card">
  <div class="home-icon">
    <i class="bi bi-speedometer2"></i>
  </div>

  <h5>Admin Dashboard</h5>
  <span>
    Manage products, users, and orders from one place.
  </span>
</div>

   <div id="loader-overlay">
    <div class="spinner-border text-primary loader-spinner" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  <script>
    const toggleBtn = document.getElementById("toggleSidebar");
    const sidebar = document.querySelector(".admin-sidebar");

    toggleBtn?.addEventListener("click", () => {
      sidebar.classList.toggle("show");
    });
  </script>
</body>

</html>

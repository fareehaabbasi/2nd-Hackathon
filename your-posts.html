<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Dark Theme -->
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="create-post.css" />
  <link rel="stylesheet" href="all-posts.css" />
  <link rel="stylesheet" href="your-posts.css" />
</head>

<body>

     <!-- NAVBAR -->
  <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg admin-navbar bg-light shadow-sm mb-4">
  <div class="container-fluid">

    <!-- Brand / Left -->
    <span class="navbar-brand fw-bold">Post App</span>

    <!-- Center Links -->
    <div class="mx-auto d-none d-lg-flex gap-4">
      <a href="All-posts.html" class="nav-link fw-bold">Home</a>
      <a href="your-posts.html" class="nav-link fw-bold active">Your Posts</a>
      <a href="create-post.html" class="nav-link fw-bold">Post Your Thoughts</a>
    </div>

    <!-- Right: User info + Logout -->
    <div class="d-flex align-items-center gap-3">
      <!-- User Info -->
      <div class="user-info d-flex align-items-center gap-2">
        <div class="user-avatar rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width:35px; height:35px;">
          <i class="bi bi-person-fill"></i>
        </div>
        <span class="user-name">User Name</span>
      </div>

      <!-- Logout -->
      <button class="btn btn-logout btn-sm">
        Logout
      </button>
    </div>

  </div>
</nav>

<!-- Add New Post Button -->
<div class="container my-3 text-end">
  <a href="create-post.html" class="btn btn-cobalt">Add New Post</a>
</div>


  <!-- CONTENT -->
<main class="container my-4">
  <h3>Your Posts</h3>
  <div class="row" id="myPostsContainer">
    <!-- User posts will be injected here -->
  </div>
</main>

<!-- Edit Post Modal -->
<div class="modal fade" id="editPostModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <form id="editPostForm">
        <div class="modal-header">
          <h5 class="modal-title">Edit Post</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="editPostId" />
          
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="editTitle" class="form-control" required />
          </div>

          <div class="mb-3">
            <label class="form-label">Content</label>
            <textarea id="editContent" class="form-control" rows="4" required></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Category</label>
            <select id="editCategory" class="form-control" required>
              <option value="Tech">Tech</option>
              <option value="Life">Life</option>
              <option value="Education">Education</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Image (optional)</label>
            <input type="file" id="editImage" class="form-control" accept="image/*"/>
          </div>

        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-cobalt w-100">Update Post</button>
        </div>
      </form>
    </div>
  </div>
</div>


  <!-- Loader -->
  <div id="loader-overlay" style="display:none; position:fixed; inset:0; background:rgba(255,255,255,0.7); z-index:9999; align-items:center; justify-content:center;">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

    <!-- JS links -->
    <script type="module" src="authentication.js"></script>
    <script type="module" src="config.js"></script>
    <script type="module" src="create-post.js"></script>
    <script type="module" src="all-posts.js"></script>
    <script type="module" src="your-post.js"></script>
    <!-- Bootstrap Bundle JS (includes Popper) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- Dark Theme -->
  <link href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5/dark.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="create-post.css" />
</head>

<body>
  <!-- NAVBAR -->
<nav class="navbar navbar-expand-lg admin-navbar bg-light shadow-sm mb-4">
  <div class="container-fluid">

    <!-- Brand / Left -->
    <span class="navbar-brand fw-bold">Post App</span>

    <!-- Center Links -->
    <div class="mx-auto d-none d-lg-flex gap-4">
      <a href="All-posts.html" class="nav-link fw-bold">Home</a>
      <a href="your-posts.html" class="nav-link fw-bold">Your Posts</a>
      <a href="create-post.html" class="nav-link fw-bold active">Post Your Thoughts</a>
    </div>

    <!-- Right: User info + Logout -->
    <div class="d-flex align-items-center gap-3">
      <!-- User Info -->
      <div class="user-info d-flex align-items-center gap-2">
        <div class="user-avatar rounded-circle bg-secondary text-white d-flex align-items-center justify-content-center" style="width:35px; height:35px;">
          <i class="bi bi-person-fill"></i>
        </div>
        <span class="user-name">User Name</span>
      </div>

      <!-- Logout -->
      <button class="btn btn-logout btn-sm">
        Logout
      </button>
    </div>

  </div>
</nav>


  <!-- CONTENT -->
  <main class="admin-content">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="mb-3">New Post</h5>

            <form id="createPostForm">

  <!-- Title -->
  <div class="mb-3">
    <label class="form-label">Title</label>
    <input
      type="text"
      class="form-control"
      id="title"
      placeholder="Enter post title"
      required
    />
  </div>

  <!-- Content -->
  <div class="mb-3">
    <label class="form-label">Content</label>
    <textarea
      class="form-control"
      id="content"
      rows="5"
      placeholder="Write your post content here..."
      required
    ></textarea>
  </div>

  <!-- Category -->
  <div class="mb-3">
    <label class="form-label">Category</label>
    <select class="form-control" id="category" required>
      <option value="">Select a category</option>
      <option value="Tech">Tech</option>
      <option value="Life">Life</option>
      <option value="Education">Education</option>
    </select>
  </div>

  <!-- Image -->
  <div class="mb-3">
    <label class="form-label">Post Image (optional)</label>
    <input
      type="file"
      class="form-control"
      id="pimage"
      accept="image/*"
    />
  </div>

  <button type="submit" class="btn btn-cobalt w-100">
    Publish Post
  </button>
</form>


          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- Loader -->
  <div id="loader-overlay">
    <div class="spinner-border text-primary" role="status"></div>
  </div>

    <!-- JS links -->
    <script type="module" src="authentication.js"></script>
    <script type="module" src="config.js"></script>
    <script type="module" src="create-post.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</body>

</html>
